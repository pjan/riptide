[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
]

[advisories]
# Unmaintained/unsound transitive deps — scope to "none" to avoid noise;
# address by updating direct deps when practical.
unmaintained = "none"
unsound = "none"
# Known advisory IDs in the transitive dep tree as of initial setup.
# Review periodically and remove entries once deps are updated.
ignore = [
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0012",
    "RUSTSEC-2025-0119",
    "RUSTSEC-2026-0190",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0285",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0386",
]

[bans]
multiple-versions = "warn"
# Workspace-internal path deps are not intended for crates.io publication.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
